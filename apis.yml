name: Finnomena
description: Finnomena is a Thailand-based wealth-technology and investment platform, headquartered in
  Bangkok, that lets retail investors research, buy, hold, and rebalance mutual funds and other investment
  products through a single mobile and web application. The platform combines a robo-advisory experience
  and model portfolios with an active investment community and a large body of Thai-language market
  education and analysis content. Finnomena Funds operates as a licensed investment intermediary, and the
  company was surfaced as a portfolio company of 500 Global. As of this enrichment pass Finnomena publishes
  a consumer-facing WordPress marketing site and a mobile app but no public developer program, API, or
  OpenAPI surface, so this profile carries identity and domain-security data only.
